<div id="sop-loader-status" role="status">Chargement de Smash or Pass Peachies…</div>
<script>
(function () {
  if (window.__sopPeachiesBridge) return;
  var bridge = window.__sopPeachiesBridge = { queue: [], receive: null };
  ["onWidgetLoad", "onEventReceived"].forEach(function (type) {
    window.addEventListener(type, function (event) {
      var detail = type === "onWidgetLoad"
        ? { fieldData: (event.detail && event.detail.fieldData) || {} }
        : event.detail;
      var payload = { detail: detail };
      if (bridge.receive) bridge.receive(type, payload);
      else bridge.queue.push([type, payload]);
    });
  });
})();
</script>
<link rel="stylesheet" href="https://gawiene.github.io/smash-or-pass-peachies/widget/widget.css" referrerpolicy="no-referrer" />
<script src="https://gawiene.github.io/smash-or-pass-peachies/widget/widget.js" referrerpolicy="no-referrer" onerror="document.getElementById('sop-loader-status').textContent='Widget indisponible. Vérifier GitHub Pages puis recharger.'"></script>
